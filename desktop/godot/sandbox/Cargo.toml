[package]
name = "craftmine-godot-sandbox-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
sha2 = "0.11"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Memory"] }

[[bin]]
name = "boundary-probe"
