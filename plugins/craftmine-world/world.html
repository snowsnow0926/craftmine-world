<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; frame-src 'self' file:; style-src 'unsafe-inline'; base-uri 'none'">
  <title>世界 · 最中幻想</title>
  <style>
    :root { color-scheme: light dark; font-family:system-ui,'Microsoft YaHei',sans-serif; }
    * { box-sizing:border-box; } body { margin:0; height:100vh; display:flex; flex-direction:column; position:relative; background:light-dark(#fafafa,#191919); color:light-dark(#242424,#dedede); }
    header { min-height:46px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:7px 12px; font-size:12px; border-bottom:1px solid light-dark(#e3e3e3,#333); }
    button,input,select { font:inherit; color:inherit; border:1px solid light-dark(#ddd,#444); border-radius:6px; background:light-dark(#fff,#242424); padding:6px 9px; }
    button { cursor:pointer; white-space:nowrap; } button:hover { background:light-dark(#eee,#333); } button:disabled { opacity:.45; cursor:default; }
    select { min-width:70px; max-width:220px; flex:1; } .save-state { margin-left:auto; color:light-dark(#606060,#aaa); font-size:11px; } [data-error] { color:light-dark(#a82a2a,#ef9999); }
    #create-form { padding:10px 12px; display:flex; gap:8px; background:light-dark(#f0f0f0,#222); } #create-form[hidden] { display:none; } #world-name { min-width:0; flex:1; }
    #error { padding:8px 12px; font-size:12px; background:light-dark(#fff1f0,#3d2020); } #error[hidden] { display:none; }
    #import-result { padding:8px 12px; font-size:12px; color:light-dark(#376445,#afd0b8); } #import-result[hidden] { display:none; }
    :focus-visible { outline:2px solid light-dark(#47795e,#9cceae); outline-offset:2px; }
    iframe { display:block; flex:1; width:100%; border:0; min-height:0; }
    /* Godot worlds run in a sibling Electron view that covers #godot-surface.
       This page renders only the chrome (header + modes bar) plus the
       placeholder, and the chrome must stay exactly --godot-chrome tall so the
       placeholder top matches the host-reserved offset. */
    #godot-surface { display:none; }
    body[data-godot="true"] header { height:46px; flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden; }
    body[data-godot="true"] .modes { height:calc(var(--godot-chrome,76px) - 46px); flex-wrap:nowrap; align-items:center; overflow-x:auto; overflow-y:hidden; padding:2px 12px; }
    body[data-godot="true"] .modes button { padding:4px 9px; }
    body[data-godot="true"] iframe { display:none; }
    body[data-godot="true"] #godot-surface { display:block; position:absolute; inset:0; }
    body[data-godot="true"] #create-form,body[data-godot="true"] #error,body[data-godot="true"] #import-result,body[data-godot="true"] #selection-context { position:absolute; left:0; right:0; bottom:0; z-index:3; }
    #godot-loading { display:none; position:absolute; inset:0; z-index:5; align-items:center; justify-content:center; pointer-events:none; background:color-mix(in srgb, #101820 72%, transparent); color:#fff; text-align:center; }
    #godot-loading[aria-hidden="false"] { display:flex; }
    #godot-loading-card { width:min(420px, calc(100% - 32px)); padding:20px 24px; border:1px solid rgb(255 255 255 / 22%); border-radius:14px; background:rgb(13 22 30 / 88%); box-shadow:0 12px 40px rgb(0 0 0 / 35%); }
    #godot-loading-title { margin:0; font-size:16px; font-weight:650; }
    #godot-loading-detail { margin:8px 0 0; color:#d7e7ef; font-size:12px; line-height:1.6; }
    #godot-loading-spinner { width:24px; height:24px; margin:0 auto 12px; border:3px solid rgb(255 255 255 / 25%); border-top-color:#b2d2bd; border-radius:50%; animation:godot-loading-spin .8s linear infinite; }
    #godot-loading[data-state="failed"] #godot-loading-spinner { display:none; }
    #godot-loading-progress { display:block; width:100%; height:7px; margin-top:16px; accent-color:#b2d2bd; }
    #godot-loading[data-state="failed"] #godot-loading-progress { display:none; }
    #godot-loading-actions { display:flex; gap:8px; justify-content:center; margin-top:16px; pointer-events:auto; }
    #godot-loading-actions[hidden] { display:none; }
    @keyframes godot-loading-spin { to { transform:rotate(360deg); } }
    .modes { display:flex; flex-wrap:wrap; gap:4px; padding:6px 12px; border-bottom:1px solid light-dark(#e3e3e3,#333); }
    .modes button { border-color:transparent; background:transparent; font-size:12px; }
    .modes button[aria-selected="true"] { background:light-dark(#e9e9e9,#303030); }
    #surface { position:relative; flex:1; min-height:0; display:flex; }
    body[data-immersive="true"] > header,
    body[data-immersive="true"] > .modes,
    body[data-immersive="true"] > #selection-context { display:none; }
    body[data-immersive="true"] > #surface { position:absolute; inset:0; }
    body[data-immersive="true"] > #error,
    body[data-immersive="true"] > #import-result { position:absolute; bottom:0; left:0; right:0; z-index:4; }
    #immersion-hint { display:none; }
    body[data-immersive="true"]:not([data-godot="true"]) #immersion-hint {
      display:block; position:fixed; bottom:12px; right:16px; z-index:5;
      pointer-events:none; font-size:12px; color:#fff;
      text-shadow:0 1px 3px #000;
    }
    #checks-panel,#preview-panel { position:absolute; inset:0; background:light-dark(#fafafa,#191919); }
    #checks-panel { overflow:auto; padding:14px; font-size:12px; }
    #checks-panel[hidden],#preview-panel[hidden] { display:none; }
    #preview-panel { display:flex; flex-direction:column; }
    #preview-panel header { flex:none; }
    #preview-title { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #preview-review { flex:none; max-height:32vh; overflow:auto; padding:8px 12px; border-bottom:1px solid light-dark(#ddd,#393939); font-size:12px; line-height:1.6; }
    #preview-review p { margin:5px 0; overflow-wrap:anywhere; }
    #preview-review ul { margin:6px 0; padding-left:20px; }
    #apply-world { background:light-dark(#316349,#b2d2bd); color:light-dark(#fff,#16231b); border-color:transparent; }
    #review-state { font-weight:550; }
    #apply-explanation { flex:none; padding:8px 12px; border-bottom:1px solid light-dark(#ddd,#393939); font-size:12px; line-height:1.6; }
    #apply-explanation p { margin:3px 0; overflow-wrap:anywhere; }
    /* Keep the sibling Godot candidate's 46 + 100px chrome reservation aligned. */
    body[data-godot="true"] #apply-explanation { height:100px; overflow:auto; }
    #apply-reason { font-weight:550; }
    .check-row { padding:12px; margin-bottom:10px; border:1px solid light-dark(#ddd,#393939); border-radius:8px; }
    .check-row h3 { margin:0 0 6px; font-size:13px; font-weight:550; overflow-wrap:anywhere; }
    .check-meta { color:light-dark(#656565,#aaa); display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 10px; }
    .check-actions { display:flex; gap:6px; }
    .check-row[data-state="passed"] { border-left:3px solid light-dark(#50876a,#84bba0); }
    .check-row[data-state="failed"] { border-left:3px solid light-dark(#b04a44,#ce8983); }
    #check-detail { margin-top:14px; border-top:1px solid light-dark(#ddd,#444); padding-top:12px; }
    #check-evidence { white-space:pre-wrap; overflow-wrap:anywhere; max-height:45vh; overflow:auto; font:11px/1.6 ui-monospace,monospace; }
    #checks-empty { color:light-dark(#656565,#aaa); line-height:1.7; }
    #workbench-panel { position:absolute; inset:0; overflow:auto; background:light-dark(#fafafa,#191919); padding:14px; font-size:12px; line-height:1.65; }
    #workbench-panel[hidden],[data-workbench-page][hidden] { display:none; }
    .workbench-card,.workbench-detail { border:1px solid light-dark(#ddd,#393939); border-radius:9px; margin:10px 0; padding:12px; overflow-wrap:anywhere; }
    .workbench-card h3,.workbench-detail h3 { margin:0 0 6px; font-size:13px; font-weight:600; }
    .workbench-card p { margin:5px 0; }
    .workbench-card form,.workbench-detail>form { display:inline-flex; margin:5px 5px 0 0; }
    .workbench-meta,.workbench-empty { color:light-dark(#5f6361,#aeb6b0); }
    .issue-description { white-space:pre-wrap; overflow-wrap:anywhere; }
    [data-issue-description] { display:block; width:100%; box-sizing:border-box; margin:6px 0; }
    .issue-create { display:block; width:100%; }
    .workbench-search,.workbench-form { display:flex; flex-wrap:wrap; align-items:end; gap:9px; margin:8px 0 14px; }
    .workbench-search label,.workbench-form label { display:flex; flex-direction:column; gap:4px; min-width:0; flex:1 1 130px; }
    .workbench-search input,.workbench-search select,.workbench-form input,.workbench-form select,.workbench-form textarea { width:100%; min-width:0; max-width:100%; }
    .workbench-form textarea { resize:vertical; min-height:86px; color:inherit; background:light-dark(#fff,#242424); border:1px solid light-dark(#ddd,#444); border-radius:6px; padding:8px; font:inherit; }
    .workbench-form label:has(textarea) { flex-basis:100%; }
    .workbench-search input[type=checkbox],.workbench-form input[type=checkbox] { width:auto; align-self:start; }
    .workbench-notice { min-height:20px; margin:0 0 10px; overflow-wrap:anywhere; }
    .workbench-notice[data-error=true] { color:light-dark(#a82a2a,#ef9999); }
    .workbench-notice[data-error=false] { color:light-dark(#376445,#afd0b8); }
    .workbench-code { white-space:pre-wrap; overflow-wrap:anywhere; overflow:auto; max-height:40vh; font:11px/1.6 ui-monospace,monospace; }
    .workbench-hash { overflow-wrap:anywhere; font:10px/1.5 ui-monospace,monospace; color:light-dark(#656565,#aaa); }
    #selection-context { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:7px 12px; background:light-dark(#eaf1eb,#213529); font-size:12px; }
    #selection-context[hidden] { display:none; } #selection-context span { flex:1; overflow-wrap:anywhere; }
    #refresh-workbench { margin-left:auto; } #refresh-workbench button { font-size:11px; }
    @media(max-width:420px) { header { gap:6px; padding:7px 8px; } .modes { padding:6px 8px; gap:2px; } .modes button { padding:6px; } .save-state { flex-basis:70px; } #workbench-panel { padding:10px; } .workbench-card form { display:flex; } }
  </style>
  <script src="view.js" defer></script>
</head>
<body>
  <header>
    <select id="world-list" aria-label="当前世界" disabled><option>正在载入…</option></select>
    <button id="new-world" type="button" disabled>新建</button>
    <form id="import-form"><button id="import-world" type="submit" disabled>导入旧世界</button></form>
    <span id="world-status" class="save-state" role="status">正在载入</span>
    <button id="save-world" type="button" disabled>保存</button>
  </header>
  <form id="create-form" hidden>
    <input id="world-name" name="title" aria-label="世界名称" placeholder="给世界起个名字" maxlength="80" required>
    <button type="submit">创建空白世界</button>
    <button id="cancel-create" type="button">取消</button>
  </form>
  <div id="error" role="alert" hidden></div>
  <div id="import-result" role="status" hidden></div>
  <div id="selection-context" aria-label="已选需求对象" hidden></div>
  <nav class="modes" aria-label="世界工作面板">
    <button id="world-mode" type="button" aria-selected="true">世界</button>
    <button id="checks-mode" type="button" aria-selected="false">检查记录</button>
    <button type="button" data-workbench-tab="library" aria-selected="false">作品库</button>
    <button type="button" data-workbench-tab="memory" aria-selected="false">记忆</button>
    <button type="button" data-workbench-tab="task" aria-selected="false">任务</button>
    <button type="button" data-workbench-tab="backup" aria-selected="false">备份</button>
    <form id="refresh-workbench"><button type="submit" title="重新读取服务状态">刷新</button></form>
  </nav>
  <main id="surface">
    <span id="immersion-hint" aria-hidden="true">F2 对话 · Shift+F2 工作台</span>
    <div id="godot-loading" aria-hidden="false" data-state="loading" role="status" aria-live="polite">
      <div id="godot-loading-card"><div id="godot-loading-spinner" aria-hidden="true"></div><p id="godot-loading-title">正在加载世界…</p><p id="godot-loading-detail">正在读取世界列表和启动资源，请稍候。</p><progress id="godot-loading-progress" aria-label="世界加载进度"></progress><div id="godot-loading-actions" hidden><button id="godot-loading-retry" type="button">重试加载</button><button id="godot-loading-back" type="button" hidden>返回原世界</button></div></div>
    </div>
    <div id="godot-surface" role="region" aria-label="Godot 世界画面区域"></div>
    <iframe title="可游玩的世界" sandbox="allow-scripts allow-pointer-lock"></iframe>
    <section id="workbench-panel" aria-label="创作工作台" hidden></section>
    <section id="checks-panel" aria-label="检查记录" hidden>
      <p id="checks-empty">还没有检查记录。创作助手修改好草稿后，可以在后台检查并生成预览。</p>
      <div id="checks-list"></div>
      <button id="checks-more" type="button" hidden>更早的记录</button>
      <section id="check-detail" hidden><strong>检查结果</strong><div id="check-overview"></div><details><summary>详细记录</summary><pre id="check-evidence"></pre><button id="evidence-more" type="button" hidden>继续读取</button></details></section>
    </section>
    <section id="preview-panel" aria-label="草稿预览" hidden>
      <header><span id="preview-title">草稿预览</span><span class="save-state">独立副本</span><button id="close-preview" type="button">返回世界</button><form id="apply-form"><button id="apply-world" type="submit" disabled>应用到世界</button><button id="apply-world-warnings" type="submit" hidden disabled>带评审提示应用</button></form></header>
      <section id="apply-explanation" aria-label="应用条件" role="status" aria-live="polite">
        <p id="apply-reason">尚未打开可应用的草稿预览。</p><p id="apply-next-step">在检查记录中打开当前草稿。</p>
        <button id="refresh-apply-state" type="button" hidden>刷新状态</button>
        <details id="apply-error-details" hidden><summary>查看未完成原因</summary><p id="apply-error-text"></p></details>
      </section>
      <section id="preview-review" aria-label="需求检查和评审">
        <div id="review-state" role="status">正在读取评审…</div>
        <details id="review-details"><summary>查看需求与建议</summary><div id="review-notes"></div></details>
        <button id="retry-review" type="button" hidden>重新评审</button>
        <button id="cancel-review" type="button" hidden>取消评审</button>
      </section>
    </section>
  </main>
</body>
</html>
