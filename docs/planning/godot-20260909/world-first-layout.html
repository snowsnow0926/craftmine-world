<style>
#cw-layout-proposal{--cw-bg:light-dark(#fafafa,#171717);--cw-side:light-dark(#f1f1f1,#101010);--cw-panel:light-dark(#ffffff,#1c1c1c);--cw-soft:light-dark(#e9e9e9,#292929);--cw-line:light-dark(#d8d8d8,#353535);--cw-text:light-dark(#202020,#f0f0f0);--cw-muted:light-dark(#626262,#ababab);--cw-accent:light-dark(#355a46,#b5dbc2);--cw-sky:light-dark(#bad6d5,#77999c);--cw-grass:light-dark(#82a769,#62894f);--cw-tree:light-dark(#47734b,#416545);--cw-leaf:light-dark(#638e51,#5a7d4d);--cw-wood:light-dark(#886144,#78573f);--cw-path:light-dark(#d4b993,#ae956f);--cw-water:light-dark(#7daab3,#557f8d);--cw-stone:light-dark(#89918a,#5c696a);--cw-night:light-dark(#53667a,#354153);--cw-chat:310px;color:var(--cw-text);font-family:'Segoe UI','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.5;width:100%;background:var(--cw-bg);border:1px solid var(--cw-line);border-radius:10px;overflow:hidden;box-sizing:border-box;container-type:inline-size}
#cw-layout-proposal *{box-sizing:border-box}
#cw-layout-proposal [hidden]{display:none!important}
#cw-layout-proposal button,#cw-layout-proposal textarea{font:inherit;color:inherit}
#cw-layout-proposal button{cursor:pointer;background:transparent;border:0;border-radius:6px;padding:7px 10px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-align:left}
#cw-layout-proposal button:hover{background:var(--cw-soft)}
#cw-layout-proposal button[aria-pressed=true]{background:var(--cw-soft);color:var(--cw-text)}
#cw-layout-proposal button:disabled{cursor:default;opacity:.5}
#cw-layout-proposal .cw-icon{padding:7px;flex-shrink:0}
#cw-layout-proposal .cw-titlebar{min-height:42px;padding:7px 14px;border-bottom:1px solid var(--cw-line);display:flex;gap:12px;align-items:center;background:var(--cw-panel)}
#cw-layout-proposal .cw-brand{font-weight:500;display:flex;gap:8px;align-items:center}
#cw-layout-proposal .cw-note{color:var(--cw-muted);font-size:12px}
#cw-layout-proposal .cw-end{margin-left:auto}
#cw-layout-proposal .cw-layout{display:grid;grid-template-columns:148px minmax(0,1fr) var(--cw-chat);min-height:518px}
#cw-layout-proposal .cw-sidebar{background:var(--cw-side);padding:13px 9px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--cw-line);min-width:0}
#cw-layout-proposal .cw-section-label{font-size:12px;color:var(--cw-muted);padding:7px 8px}
#cw-layout-proposal .cw-world-item{display:flex;width:100%;justify-content:flex-start;padding:10px 8px;gap:8px}
#cw-layout-proposal .cw-world-item span{display:block;min-width:0;overflow-wrap:anywhere}
#cw-layout-proposal .cw-world-item small{display:block;font-size:11px;color:var(--cw-muted);margin-top:3px}
#cw-layout-proposal .cw-sidebar-foot{margin-top:auto;border-top:1px solid var(--cw-line);padding:10px 8px 0;color:var(--cw-muted);font-size:12px}
#cw-layout-proposal .cw-workspace{min-width:0;display:flex;flex-direction:column}
#cw-layout-proposal .cw-worldbar{padding:10px 13px;border-bottom:1px solid var(--cw-line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:58px}
#cw-layout-proposal .cw-world-title{font-weight:500;overflow-wrap:anywhere}
#cw-layout-proposal .cw-mode{display:flex;gap:3px;margin-left:auto;font-size:12px}
#cw-layout-proposal .cw-stage{position:relative;min-height:366px;flex:1;isolation:isolate;background:var(--cw-sky)}
#cw-layout-proposal .cw-scene{position:absolute;inset:0;width:100%;height:100%}
#cw-layout-proposal .cw-scene-note{position:absolute;top:12px;left:12px;padding:5px 8px;background:var(--cw-panel);border-radius:5px;font-size:11px;color:var(--cw-muted)}
#cw-layout-proposal .cw-world-action{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);background:var(--cw-panel);padding:9px 16px;border-radius:7px;text-align:center;white-space:nowrap}
#cw-layout-proposal .cw-world-action strong{font-weight:500;display:block}
#cw-layout-proposal .cw-world-action span{font-size:11px;color:var(--cw-muted)}
#cw-layout-proposal .cw-world-footer{min-height:54px;display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--cw-panel);font-size:12px}
#cw-layout-proposal .cw-world-footer span{padding:5px 7px;color:var(--cw-muted)}
#cw-layout-proposal .cw-chat{min-width:0;display:flex;flex-direction:column;border-left:1px solid var(--cw-line);background:var(--cw-panel)}
#cw-layout-proposal .cw-chatbar{padding:13px 14px;border-bottom:1px solid var(--cw-line);display:flex;align-items:center;gap:8px;min-height:58px}
#cw-layout-proposal .cw-chatbody{padding:17px 16px;display:flex;flex-direction:column;gap:18px;flex:1}
#cw-layout-proposal .cw-user-message{background:var(--cw-soft);border-radius:9px;padding:11px 13px;margin-left:18px;overflow-wrap:anywhere}
#cw-layout-proposal .cw-reply{padding:0 2px;overflow-wrap:anywhere}
#cw-layout-proposal .cw-reply p{margin:0 0 9px}
#cw-layout-proposal .cw-result{display:flex;align-items:center;gap:6px;color:var(--cw-accent);font-size:12px;margin-bottom:10px}
#cw-layout-proposal .cw-details{font-size:12px;color:var(--cw-muted)}
#cw-layout-proposal .cw-details summary{cursor:pointer}
#cw-layout-proposal .cw-details p{margin:8px 0 0}
#cw-layout-proposal .cw-compose{margin:0 12px 12px;background:var(--cw-soft);border:1px solid var(--cw-line);border-radius:11px;padding:11px}
#cw-layout-proposal textarea{width:100%;resize:vertical;min-height:66px;max-height:160px;border:0;background:transparent;padding:0;font-size:14px}
#cw-layout-proposal textarea::placeholder{color:var(--cw-muted)}
#cw-layout-proposal .cw-composebar{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--cw-muted)}
#cw-layout-proposal .cw-composebar button{margin-left:auto;background:var(--cw-panel)}
#cw-layout-proposal[data-play=true] .cw-layout{grid-template-columns:minmax(0,1fr)}
#cw-layout-proposal[data-play=true] .cw-sidebar,#cw-layout-proposal[data-play=true] .cw-chat{display:none}
#cw-layout-proposal[data-compact=true] .cw-layout{grid-template-columns:64px minmax(0,1fr) var(--cw-chat)}
#cw-layout-proposal[data-compact=true] .cw-sidebar .cw-world-item span,#cw-layout-proposal[data-compact=true] .cw-section-label,#cw-layout-proposal[data-compact=true] .cw-sidebar-foot{display:none}
#cw-layout-proposal[data-compact=true] .cw-world-item{justify-content:center;padding:12px 7px}
#cw-layout-proposal[data-play=true] .cw-layout{grid-template-columns:minmax(0,1fr)}
@container(max-width:850px){#cw-layout-proposal .cw-layout{grid-template-columns:60px minmax(0,1fr) 280px}#cw-layout-proposal .cw-sidebar .cw-world-item span,#cw-layout-proposal .cw-section-label,#cw-layout-proposal .cw-sidebar-foot{display:none}#cw-layout-proposal .cw-world-item{justify-content:center;padding:12px 7px}#cw-layout-proposal[data-compact=true] .cw-layout{grid-template-columns:60px minmax(0,1fr) 280px}}
@container(max-width:620px){#cw-layout-proposal .cw-layout,#cw-layout-proposal[data-compact=true] .cw-layout{display:flex;flex-direction:column}#cw-layout-proposal .cw-sidebar{flex-direction:row;border-right:0;border-bottom:1px solid var(--cw-line);padding:6px;gap:4px}#cw-layout-proposal .cw-world-item{width:auto;flex:1}#cw-layout-proposal .cw-sidebar .cw-world-item span{display:block;font-size:12px}#cw-layout-proposal .cw-sidebar .cw-world-item small{display:none}#cw-layout-proposal .cw-stage{min-height:300px}#cw-layout-proposal .cw-chat{border-left:0;border-top:1px solid var(--cw-line)}#cw-layout-proposal .cw-titlebar{flex-wrap:wrap}#cw-layout-proposal .cw-chatbody{gap:12px}#cw-layout-proposal .cw-titlebar .cw-end{margin-left:0}#cw-layout-proposal .cw-worldbar{padding:9px}}
@media(pointer:coarse){#cw-layout-proposal button{min-height:44px}#cw-layout-proposal textarea{font-size:16px}}
</style>

          <path d="M182 143H204V212H182Z" fill="var(--cw-wood)"/>

        </svg>

    <aside class="cw-chat" aria-label="当前世界的创作对话">

<script>
(()=>{
  const root=document.getElementById('cw-layout-proposal');
  const settings={chatWidth:310,compactSidebar:false};
  const worlds={
    '3d':{title:'我的第一个世界',label:'3D 第一人称 · 场景示意',prompt:'在树旁种一些小花，留出一条可以走的小路。',reply:'沿两棵树之间留出通道，小花分布在道路两侧。',scope:'花草与道路布局。'},
    topdown:{title:'像素小镇',label:'2D 俯视 · 规划示意',prompt:'在小镇里加一家杂货店，让店主可以买卖物品。',reply:'把小路旁的房子改成杂货店，加入店主、商品和买卖对话。',scope:'房屋用途、店主与商店规则。'},
    side:{title:'横版遗迹',label:'2D 横版 · 规划示意',prompt:'让我获得二段跳后，能回到这里到达上方的门。',reply:'保留回到这里的路线，调整上方平台高度，让新能力能打开新的探索区域。',scope:'平台高度、能力解锁与通路。'}
  };
  function selectWorld(id){
    const world=worlds[id];if(!world)return;
    root.dataset.world=id;
    root.querySelector('[data-world-title]').textContent=world.title;
    root.querySelector('[data-chat-world]').textContent=world.title+' · 对话示意';
    root.querySelector('[data-prompt]').textContent=world.prompt;
    root.querySelector('[data-reply]').textContent=world.reply;
    root.querySelector('[data-scope]').textContent=world.scope;
    root.querySelector('[data-scene-label]').textContent=world.label;
    root.querySelectorAll('[data-world]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.world===id)));
    root.querySelectorAll('[data-scene]').forEach(el=>el.toggleAttribute('hidden',el.dataset.scene!==id));
  }
  root.querySelectorAll('button[data-world]').forEach(el=>el.addEventListener('click',()=>selectWorld(el.dataset.world)));
  root.querySelectorAll('[data-mode]').forEach(el=>el.addEventListener('click',()=>{
    const playing=el.dataset.mode==='play';root.dataset.play=String(playing);
    root.querySelectorAll('[data-mode]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn===el)));
  }));
  function renderSettings(){root.style.setProperty('--cw-chat',settings.chatWidth+'px');root.dataset.compact=String(settings.compactSidebar);}
  selectWorld('3d');renderSettings();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:renderSettings});tweak.addSlider(settings,'chatWidth',{label:'对话栏宽度',min:280,max:380,step:10,unit:'px'});tweak.addToggle(settings,'compactSidebar',{label:'收起左侧世界列表'});}
})();
</script>
