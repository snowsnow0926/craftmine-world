[package]
name = "craftmine-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Durable Craftmine world task transactions"

[dependencies]
anyhow = "1"
base64 = "0.23"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
