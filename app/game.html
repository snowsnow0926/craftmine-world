<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>最中幻想 · 世界</title><link rel="stylesheet" href="/app/game.css"><script src="/runtime.js" defer></script><script type="module" src="/app/game.js"></script></head>
<body><canvas id="world" tabindex="0" aria-label="第一人称三维世界"></canvas><div id="crosshair">+</div><div id="hit-marker">×</div><div id="target"></div><button id="enter">进入世界 <small>WASD 移动 · 鼠标环顾 · T 对话</small></button><div id="notice" hidden></div>
<div id="health-hud" class="hud" hidden><span>生命值</span><strong id="health-value"></strong><progress id="health-meter" max="100" value="100"></progress></div>
<div id="weapon-hud" class="hud" hidden><span id="weapon-name"></span><strong id="ammo"></strong><small id="weapon-controls"></small></div>
<div id="held-item" hidden><svg class="blaster" viewBox="0 0 250 220" aria-label="训练枪"><path fill="#203a3d" d="M65 100L110 40L160 60L165 110L225 160L220 220L100 220Z"/><path fill="#587573" d="M65 100L100 65L147 86L165 110L113 138Z"/><path fill="#304b4e" d="M100 65L110 40L160 60L147 86Z"/><path fill="#b2e4cd" d="M112 69L117 55L145 67L141 81Z"/><path fill="#b9ac8a" d="M100 169L149 139L209 183L193 220L111 220Z"/><path fill="#91c8c1" d="M98 117L126 103L138 114L110 130Z"/></svg><svg class="sword" viewBox="0 0 250 300" aria-label="训练剑"><path fill="#d3e5de" d="M40 0L88 24L185 202L157 217L52 40Z"/><path fill="#779d99" d="M40 0L185 202L173 210L52 40Z"/><path fill="#bfa365" d="M132 216L186 187L198 207L145 237Z"/><path fill="#5b4033" d="M162 229L183 217L226 288L203 300Z"/></svg></div>
<div id="death" hidden><strong>你倒下了</strong><p>创造的世界仍在，准备好就继续。</p><button id="revive">复活 · Enter</button></div>
</body></html>
